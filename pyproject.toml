[project]
name = "meta-scanner"
version = "0.1.0"
description = "Local Japanese document metadata extraction for scheduled data catalog ingestion"
readme = "README.md"

requires-python = ">=3.14"
dependencies = [
    "lxml>=6.1.3",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "pypdf>=6.19.0",
    "pypdfium2>=5.13.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "sudachidict-full>=20260723.1",
    "sudachipy>=0.7.0",
]

[project.scripts]
meta-scanner = "meta_scanner:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
